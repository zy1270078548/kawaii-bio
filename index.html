<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>张炀 的 Kawaii Bio</title>
  <link rel="icon" href="/avatar.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Darumadrop+One&family=Gaegu:wght@400;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: 79 68 70;
      --paper: 255 249 228;
      --candy: 255 209 220;
      --sky: 188 231 238;
      --lemon: 255 246 170;
      --mint: 190 246 211;
      --lilac: 245 209 251;
      --peach: 255 205 177;
      --night: 54 49 66;
    }
    * { box-sizing: border-box; min-width: 0; }
    body {
      min-height: 100vh;
      margin: 0;
      color: rgb(var(--ink));
      font-family: Gaegu, cursive;
      background:
        radial-gradient(circle at 15% 12%, rgb(var(--sky) / .45), transparent 26rem),
        radial-gradient(circle at 90% 24%, rgb(var(--candy) / .32), transparent 22rem),
        rgb(var(--paper));
      overflow-x: hidden;
      overflow-wrap: anywhere;
    }
    body.dark {
      background:
        radial-gradient(circle at 15% 12%, rgb(var(--sky) / .24), transparent 24rem),
        radial-gradient(circle at 90% 24%, rgb(var(--candy) / .22), transparent 22rem),
        rgb(var(--night));
    }
    body::before {
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      content: "";
      opacity: .24;
      background-image:
        radial-gradient(rgb(var(--ink) / .14) .8px, transparent .8px),
        linear-gradient(120deg, rgb(var(--lemon) / .2), transparent 42%, rgb(var(--sky) / .16));
      background-size: 11px 11px, 100% 100%;
    }
    body.dark::before { opacity: .18; }
    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      border-bottom: 2px solid rgb(var(--ink));
      background: rgb(var(--sky) / .95);
      padding: 14px 18px;
      box-shadow: 0 5px 0 rgb(var(--ink) / .88);
    }
    .brand { display: flex; align-items: center; gap: 12px; }
    .logo {
      display: grid;
      width: 48px;
      height: 48px;
      place-items: center;
      rotate: -5deg;
      border: 2px solid rgb(var(--ink));
      border-radius: 14px;
      background: rgb(var(--paper));
      box-shadow: 3px 4px 0 rgb(var(--ink) / .88);
      font-family: "Darumadrop One", cursive;
      font-size: 28px;
    }
    .brand-title { font-family: "Darumadrop One", cursive; font-size: 34px; line-height: 1; }
    .pixel { font-family: "Space Mono", monospace; font-size: 12px; text-transform: uppercase; }
    .wrap { position: relative; max-width: 1280px; margin: 0 auto; padding: 32px 16px 72px; }
    .hero, .card {
      border: 2px solid rgb(var(--ink));
      border-radius: 24px;
      background: rgb(var(--paper) / .95);
      box-shadow: 5px 6px 0 rgb(var(--ink) / .88);
    }
    .hero {
      position: relative;
      overflow: hidden;
      padding: clamp(22px, 4vw, 36px);
      margin-bottom: 24px;
    }
    .washi {
      position: absolute;
      height: 24px;
      width: 130px;
      opacity: .76;
      border: 1px solid rgb(var(--ink) / .25);
      background: rgb(var(--candy));
      mask-image: repeating-linear-gradient(90deg, transparent 0 4px, #000 4px 12px);
    }
    .hero-grid { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(240px, .8fr); gap: 28px; align-items: start; }
    .badge {
      display: inline-block;
      max-width: 100%;
      rotate: -2deg;
      border: 2px solid rgb(var(--ink));
      border-radius: 999px;
      background: rgb(var(--mint));
      padding: 4px 14px;
      box-shadow: 3px 4px 0 rgb(var(--ink) / .88);
    }
    h1 {
      margin: 18px 0 30px;
      font-family: "Darumadrop One", cursive;
      font-size: clamp(56px, 10vw, 116px);
      line-height: .88;
      overflow-wrap: anywhere;
      text-shadow: 2px 2px 0 rgb(var(--sky)), 4px 4px 0 rgb(var(--candy));
    }
    body.dark h1 { text-shadow: 2px 2px 0 rgb(var(--night)), 4px 4px 0 rgb(var(--candy)); }
    .subtitle { max-width: 780px; margin: 0; font-size: clamp(28px, 4vw, 42px); line-height: 1; }
    .summary { max-width: 860px; font-size: 26px; line-height: 1.18; }
    .polaroid {
      position: relative;
      width: min(100%, 360px);
      margin: 0 auto;
      rotate: 3deg;
      border: 2px solid rgb(var(--ink));
      background: rgb(var(--paper));
      padding: 16px 16px 46px;
      box-shadow: 5px 6px 0 rgb(var(--ink) / .88);
    }
    .avatar {
      position: relative;
      display: grid;
      aspect-ratio: 1;
      place-items: center;
      overflow: hidden;
      border: 2px solid rgb(var(--ink));
      border-radius: 18px;
      background: linear-gradient(135deg, rgb(var(--sky)), rgb(var(--candy)), rgb(var(--lemon)));
    }
    .avatar-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
    }
    .avatar.has-image .avatar-img { display: block; }
    .avatar.has-image .avatar-fallback { display: none; }
    .avatar-fallback {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      height: 100%;
      padding: 14px;
      text-align: center;
      background: rgb(var(--paper) / .84);
    }
    .avatar-fallback-title {
      font-family: "Darumadrop One", cursive;
      font-size: clamp(34px, 7vw, 58px);
      line-height: 1;
    }
    .avatar-fallback-text {
      max-width: 100%;
      font-size: 16px;
      line-height: 1.1;
      overflow-wrap: anywhere;
    }
    .main-grid { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 20px; }
    .stack { display: grid; gap: 20px; }
    .card { padding: 22px; transform: rotate(var(--tilt, 0deg)); }
    .card h2 { margin: 0 0 14px; font-family: "Darumadrop One", cursive; font-size: clamp(30px, 5vw, 42px); line-height: 1; }
    .skills { position: relative; min-height: 280px; overflow: hidden; border: 2px solid rgb(var(--ink)); border-radius: 22px; background: rgb(var(--lemon) / .8); padding: 22px; }
    .skill-grid { position: relative; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
    .skill-node, .pill, .project, .time {
      border: 2px solid rgb(var(--ink));
      box-shadow: 3px 4px 0 rgb(var(--ink) / .88);
      overflow-wrap: anywhere;
    }
    .skill-node { border-radius: 999px; padding: 14px; text-align: center; background: rgb(var(--candy)); }
    .skill-node:nth-child(2n) { background: rgb(var(--sky)); rotate: 3deg; }
    .skill-node:nth-child(3n) { background: rgb(var(--lilac)); rotate: -2deg; }
    .project, .time { border-radius: 18px; background: rgb(var(--paper)); padding: 16px; }
    .project h3, .time h3 { margin: 0; font-family: "Darumadrop One", cursive; font-size: 30px; line-height: 1; }
    .tag-row, .badge-row { display: flex; flex-wrap: wrap; gap: 10px; }
    .pill { border-radius: 16px; background: rgb(var(--lilac)); padding: 8px 12px; font-size: 22px; line-height: 1; }
    .stats { display: grid; gap: 13px; }
    .stat-label { display: flex; justify-content: space-between; gap: 8px; }
    .bar { height: 24px; border: 2px solid rgb(var(--ink)); border-radius: 999px; background: rgb(var(--paper)); padding: 3px; }
    .bar span { display: block; height: 100%; border: 1px solid rgb(var(--ink)); border-radius: 999px; background: rgb(var(--candy)); }
    .persona { font-size: 25px; line-height: 1.15; }
    .doodle {
      position: fixed;
      z-index: 0;
      pointer-events: none;
      font-family: "Darumadrop One", cursive;
      font-size: 48px;
      opacity: .55;
      animation: floaty 5s ease-in-out infinite;
    }
    @keyframes floaty { 0%, 100% { transform: translateY(0) rotate(-6deg); } 50% { transform: translateY(-14px) rotate(5deg); } }
    @media (max-width: 900px) {
      .hero-grid, .main-grid { grid-template-columns: 1fr; }
      .skill-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .topbar { align-items: flex-start; flex-direction: column; }
    }
    @media (max-width: 520px) {
      .wrap { padding-inline: 12px; }
      .hero, .card { padding: 16px; }
      .skill-grid { grid-template-columns: 1fr; }
      .summary, .persona { font-size: 22px; }
      .pill { font-size: 19px; }
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
    const profile = {"identity":{"name":"张炀","title":"全栈向前端开发者 · 小程序与 Electron 实验室主理人","avatarMood":"sparkling-with-curiosity","location":"北京 · 可远程","summary":"27岁前端开发者，专注Vue2/3、小程序、Electron与WebRTC实践。热爱用代码搭建有温度的数字体验，从海淀健步走到局域网远程控制，持续交付轻盈又扎实的解决方案。"},"attributes":{"coding":92,"creativity":85,"communication":80,"sparkle":88},"skills":[{"name":"Vue.js","level":95,"type":"frontend"},{"name":"微信小程序","level":93,"type":"frontend"},{"name":"TypeScript","level":87,"type":"frontend"},{"name":"Electron","level":82,"type":"desktop"},{"name":"WebRTC","level":78,"type":"agent"},{"name":"uni-app","level":86,"type":"frontend"},{"name":"Git & 工程协作","level":90,"type":"other"},{"name":"UI/UX 还原力","level":84,"type":"design"}],"projects":[{"name":"局域网远程控制与音频映射系统","role":"独立开发者","description":"基于 Vue3 + Electron + WebRTC 的 P2P 音频路由与毫秒级远控工具，实现零服务器低延迟局域网协作。","tags":["Electron","WebRTC","音视频"]},{"name":"趣游红色海淀","role":"前端开发","description":"海淀区红色教育基地数字化平台，支持流式AI对话、Markdown解析、语音交互与个性化贴图地图。","tags":["小程序","AI","语音"]},{"name":"海淀创森健步走","role":"前端开发","description":"沉浸式健步走小程序，通过后台定位+polyline动态绘制行走路线，打造‘地图闯关’与‘亿步点亮’双玩法。","tags":["小程序","地图","LBS"]},{"name":"华北利星行H5商城","role":"前端开发","description":"Uni-app跨端工业品电商系统，集成神策埋点、多支付通道与拼团代金券，驱动B2B采购链路数字化。","tags":["uni-app","H5","数据驱动"]},{"name":"当阳建投后台管理系统","role":"前端开发","description":"Vue2+iView企业级后台，支持按钮级权限、OnlyOffice在线编辑、甘特图与多文件压缩下载。","tags":["Vue2","权限系统","企业后台"]}],"timeline":[{"year":"2022.04 – 至今","title":"小程序（北京）科技有限公司","text":"主力前端开发，深耕 Vue3、小程序生态与性能优化，参与多个政企级项目交付。"},{"year":"2021.03 – 2022.02","title":"青动时代科技有限公司","text":"夯实前端基建能力，熟练掌握 HTML5/CSS3/JS/TS，快速上手 React/Vue 全家桶与工程化协作。"},{"year":"2024 – 至今","title":"自由探索期","text":"密集实践 Electron、WebRTC、uni-app 与小程序云开发，积累全链路技术敏感度与自驱项目经验。"},{"year":"2019 – 2020","title":"职业起点","text":"统招大专毕业，从基础 HTML/CSS/JS 入门，完成首个企业级 H5 与小程序项目落地。"},{"year":"2018","title":"初识前端","text":"自学 HTML/CSS/JavaScript，完成个人作品集与小型响应式网站，确立职业方向。"}],"tags":["爱折腾","细节控","文档阅读者","开源爱好者","轻量化信仰者"],"badges":["5年+前端实战","30+上线项目","WebRTC局域网实践者","小程序审核通关达人"],"personality":"理性与热忱并存的技术手艺人：逻辑清晰、沟通温和、交付靠谱；喜欢拆解复杂问题，也享受用一行优雅代码点亮小确幸。对用户体验有本能敬畏，相信技术该服务于人，而非让人适应技术。","stickers":["sparkles","heart","cloud","star","cursor","bow"],"theme":"pixelDream","layout":["hero","attributes","skills","tags","projects","timeline","personality"]};
    const theme = "pixelDream";
    const darkMode = false;
    const avatarUrl = "avatar.jpg";
    const avatarHint = "请把自己的照片放到 public/ 目录下，推荐命名为 avatar.png、avatar.jpg、me.png 或 portrait.png。";
    const palettes = {"sugarPop":{"name":"Sugar Pop","ink":"79 68 70","paper":"255 249 228","candy":"255 209 220","sky":"188 231 238","lemon":"255 246 170","mint":"190 246 211","lilac":"245 209 251","peach":"255 205 177","night":"54 49 66","dark":{"candy":"255 129 190","sky":"94 225 255","lemon":"255 229 100","mint":"124 255 196","lilac":"213 157 255","peach":"255 171 132"}},"pixelDream":{"name":"Pixel Dream","ink":"65 54 82","paper":"253 244 255","candy":"255 177 216","sky":"142 230 255","lemon":"255 244 147","mint":"158 255 213","lilac":"210 188 255","peach":"255 196 160","night":"32 27 52","dark":{"candy":"255 96 190","sky":"62 213 255","lemon":"255 238 82","mint":"89 255 204","lilac":"167 130 255","peach":"255 142 112"}},"melonSoda":{"name":"Melon Soda","ink":"58 74 64","paper":"252 255 235","candy":"255 197 214","sky":"182 236 224","lemon":"250 245 157","mint":"173 244 181","lilac":"223 205 255","peach":"255 215 183","night":"39 54 53","dark":{"candy":"255 150 180","sky":"99 255 226","lemon":"238 255 112","mint":"96 255 145","lilac":"196 164 255","peach":"255 184 132"}}};
    const darkBase = {"ink":"255 246 255","paper":"21 18 34","night":"8 7 16"};
    const basePalette = palettes[theme] || palettes.sugarPop;
    const palette = darkMode ? { ...basePalette, ...darkBase, ...(basePalette.dark || {}) } : basePalette;
    Object.entries(palette).forEach(([key, value]) => {
      if (key !== 'name' && key !== 'dark') document.documentElement.style.setProperty('--' + key, value);
    });
    if (darkMode) document.body.classList.add('dark');
    const esc = (value) => String(value ?? '').replace(/[&<>"']/g, (char) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[char]));
    const list = (items, mapper) => (items || []).map(mapper).join('');
    const attrEntries = Object.entries(profile.attributes || {});
    document.getElementById('app').innerHTML = `
      <span class="doodle" style="left:7%;top:17%">+</span>
      <span class="doodle" style="right:8%;top:22%;animation-delay:.7s">&lt;3</span>
      <span class="doodle" style="left:10%;bottom:16%;animation-delay:1.3s">*</span>
      <header class="topbar">
        <div class="brand">
          <div class="logo">+</div>
          <div>
            <div class="brand-title">Kawaii Bio</div>
            <div class="pixel">published scrapbook page</div>
          </div>
        </div>
        <div class="pixel">${esc(profile.identity.location)}</div>
      </header>
      <main class="wrap">
        <section class="hero">
          <div class="washi" style="right:40px;top:16px;rotate:6deg"></div>
          <div class="hero-grid">
            <div>
              <span class="badge pixel">${esc(profile.identity.avatarMood)}</span>
              <h1>${esc(profile.identity.name)}</h1>
              <p class="subtitle">${esc(profile.identity.title)}</p>
              <p class="summary">${esc(profile.identity.summary)}</p>
            </div>
            <div class="polaroid">
              <div class="washi" style="left:50%;top:-14px;translate:-50% 0;rotate:3deg;background:rgb(var(--lilac))"></div>
              <div class="avatar" data-avatar>
                <img class="avatar-img" alt="${esc(profile.identity.name)} 的头像" />
                <div class="avatar-fallback">
                  <!-- <span class="avatar-fallback-title">放照片</span> -->
                  <span class="avatar-fallback-text">${esc(avatarHint)}</span>
                </div>
              </div>
              <div class="pixel" style="margin-top:16px;text-align:center">${esc(profile.identity.avatarMood)}</div>
            </div>
          </div>
        </section>
        <div class="main-grid">
          <div class="stack">
            <section class="card" style="--tilt:-.8deg">
              <h2>Skill Constellation</h2>
              <div class="skills">
                <svg style="position:absolute;inset:0;width:100%;height:100%" viewBox="0 0 520 260" preserveAspectRatio="none" aria-hidden="true">
                  <path d="M80 130 C150 45 210 160 270 95 S390 130 450 55" fill="none" stroke="rgb(var(--ink))" stroke-dasharray="6 8" stroke-width="3"></path>
                  <path d="M120 175 C200 235 280 180 410 215" fill="none" stroke="rgb(var(--ink))" stroke-dasharray="5 9" stroke-width="2" opacity=".65"></path>
                </svg>
                <div class="skill-grid">${list(profile.skills, (skill) => `<div class="skill-node"><div style="font-family:Darumadrop One;font-size:26px;line-height:1">${esc(skill.name)}</div><div class="pixel">lvl. ${esc(skill.level)}</div></div>`)}</div>
              </div>
            </section>
            <section class="card" style="--tilt:.4deg">
              <h2>项目展示墙</h2>
              <div class="stack">${list(profile.projects, (project) => `<article class="project"><h3>${esc(project.name)}</h3><div class="pixel">${esc(project.role)}</div><p style="font-size:22px;line-height:1.15">${esc(project.description)}</p><div class="tag-row">${list(project.tags, (tag) => `<span class="pill"># ${esc(tag)}</span>`)}</div></article>`)}</div>
            </section>
            <section class="card" style="--tilt:.6deg">
              <h2>成长时间线</h2>
              <div class="stack">${list(profile.timeline, (item) => `<article class="time"><div class="pixel">${esc(item.year)}</div><h3>${esc(item.title)}</h3><p style="font-size:22px;line-height:1.15">${esc(item.text)}</p></article>`)}</div>
            </section>
          </div>
          <aside class="stack">
            <section class="card" style="--tilt:-1.2deg">
              <h2>角色属性面板</h2>
              <div class="stats">${list(attrEntries, ([key, value]) => `<div><div class="stat-label pixel"><span>${esc(key)}</span><span>lvl. ${esc(value)}</span></div><div class="bar"><span style="width:${Math.max(0, Math.min(100, Number(value) || 0))}%"></span></div></div>`)}</div>
            </section>
            <section class="card" style="--tilt:-.5deg">
              <h2>标签墙 &amp; 成就徽章</h2>
              <div class="tag-row">${list(profile.tags, (tag) => `<span class="pill"># ${esc(tag)}</span>`)}</div>
              <div class="badge-row" style="margin-top:18px">${list(profile.badges, (badge) => `<span class="pill" style="background:rgb(var(--lemon))">* ${esc(badge)}</span>`)}</div>
            </section>
            <section class="card" style="--tilt:1.1deg">
              <h2>AI 总结人格卡片</h2>
              <p class="persona">${esc(profile.personality)}</p>
              <div class="pixel">soft chaos: 99%</div>
              <div class="pixel">agent ready: 88%</div>
              <div class="pixel">share aura: 92%</div>
            </section>
          </aside>
        </div>
      </main>
    `;
    if (avatarUrl) {
      const avatar = document.querySelector('[data-avatar]');
      const image = document.querySelector('.avatar-img');
      if (avatar && image) {
        image.src = avatarUrl;
        image.onload = () => avatar.classList.add('has-image');
        image.onerror = () => avatar.classList.remove('has-image');
        if (image.complete && image.naturalWidth > 0) avatar.classList.add('has-image');
      }
    }
  </script>
</body>
</html>
